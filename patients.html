<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BioNet - سجل المرضى الموحد</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="icon">📋</span>
        <div>
          <h1>سجل المرضى الطبي <span>الموحد</span></h1>
          <p>قاعدة البيانات السريرية لملفات التوأم الحيوي والأدوية النشطة</p>
        </div>
      </div>
      <div class="header-actions">
        <a href="new_patient.html" class="nav-badge-btn" style="border-color: #2ed573; color: #2ed573; background: rgba(46, 213, 115, 0.1);">
          <span class="badge-icon">➕</span> تسجيل مريض جديد
        </a>
        <a href="index.html" class="btn btn-primary" style="display:flex; align-items:center; text-decoration:none; height:38px; padding:0 18px;">
          ← العودة للمحاكي
        </a>
      </div>
    </header>

    <div class="card" style="margin-bottom: 20px;">
      <div class="search-bar-row">
        <input type="text" id="patientSearchInput" placeholder="ابحث برقم الهوية، اسم المريض، أو التشخيص الطبي..." style="max-width: 500px;">
        <span class="records-count" id="recordsCount">عرض 0 مرضى مسجلين</span>
      </div>
    </div>

    <div class="patients-grid" id="patientsContainer"></div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let allPatients = [];

    async function loadPatients() {
      const container = document.getElementById("patientsContainer");
      const countLabel = document.getElementById("recordsCount");
      
      try {
        allPatients = await ApiClient.getAllPatients();
        countLabel.textContent = `عرض ${allPatients.length} مرضى مسجلين`;
        renderList(allPatients);
      } catch (err) {
        container.innerHTML = `<div class="card" style="color:var(--danger-color); text-align:center;">تعذر تحميل بيانات المرضى.</div>`;
      }
    }

    function renderList(list) {
      const container = document.getElementById("patientsContainer");
      container.innerHTML = "";

      if (list.length === 0) {
        container.innerHTML = `<p class="placeholder-text">لا توجد نتائج مطابقة لبحثك.</p>`;
        return;
      }

      list.forEach(p => {
        const medPills = p.current_medications.map(m => `<span class="tag" style="margin:0;">${m}</span>`).join(" ");
        const diseases = p.chronic_diseases.map(d => `<span class="disease-badge">${d}</span>`).join(" ");

        const card = document.createElement("div");
        card.className = "card patient-card";
        card.innerHTML = `
          <div class="patient-card-header">
            <div>
              <h3 style="margin-bottom:2px;">${p.name}</h3>
              <span class="patient-id-tag">هوية: ${p.national_id} | ${p.gender} | ${p.age} سنة | النمط: ${p.pgx_profile || 'Normal'}</span>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-secondary select-patient-btn" onclick="openInSimulator('${p.national_id}')" title="فحص الأدوية">
                فحص ⤢
              </button>
              <button class="btn btn-secondary select-patient-btn" onclick="deletePatientRecord('${p.national_id}', '${p.name}')" style="color:var(--danger-color); border-color:var(--danger-color);" title="حذف المريض">
                🗑️
              </button>
            </div>
          </div>

          <div class="bio-stats-row">
            <div class="stat-pill">
              <span class="stat-title">كفاءة الكلى (GFR):</span>
              <strong style="color:${p.gfr < 60 ? 'var(--danger-color)' : 'var(--success-color)'}">${p.gfr} mL/min</strong>
            </div>
            <div class="stat-pill">
              <span class="stat-title">إنزيم الكبد (ALT):</span>
              <strong style="color:${p.liver_alt > 50 ? 'var(--warning-color)' : 'var(--success-color)'}">${p.liver_alt} U/L</strong>
            </div>
          </div>

          <div class="patient-section">
            <label class="section-label">التشخيص والأمراض المزمنة:</label>
            <div class="pills-flex">${diseases}</div>
          </div>

          <div class="patient-section">
            <label class="section-label">المنظومة الدوائية الحالية (${p.current_medications.length}):</label>
            <div class="pills-flex">${medPills}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openInSimulator(nationalId) {
      sessionStorage.setItem("autoFetchId", nationalId);
      window.location.href = "index.html";
    }

    async function deletePatientRecord(nationalId, patientName) {
      const confirmDelete = confirm(`هل أنت متأكد من رغبتك في حذف سجل المريض: "${patientName}" (هوية: ${nationalId}) نهائياً؟`);
      if (!confirmDelete) return;

      try {
        await ApiClient.deletePatient(nationalId);
        allPatients = allPatients.filter(p => p.national_id !== nationalId);
        document.getElementById("recordsCount").textContent = `عرض ${allPatients.length} مرضى مسجلين`;
        renderList(allPatients);
      } catch (err) {
        alert(err.message);
      }
    }

    document.getElementById("patientSearchInput").addEventListener("input", (e) => {
      const term = e.target.value.toLowerCase().trim();
      const filtered = allPatients.filter(p => 
        p.name.includes(term) ||
        p.national_id.includes(term) ||
        p.chronic_diseases.some(d => d.includes(term)) ||
        p.current_medications.some(m => m.toLowerCase().includes(term))
      );
      renderList(filtered);
    });

    loadPatients();
  </script>
</body>
</html>
